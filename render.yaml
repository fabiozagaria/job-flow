services:
  - type: web
    name: jobflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    envVars:
      # postgresql://user:password@host[:port]/database
      # docker-entrypoint.sh lo converte nell'URL JDBC (SPRING_DATASOURCE_URL).
      - key: DATABASE_URL
        fromDatabase:
          name: jobflow-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: jobflow-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: jobflow-db
          property: password

databases:
  # Il piano free scade dopo 30 giorni (poi 14 di grazia prima della cancellazione).
  - name: jobflow-db
    plan: free
    databaseName: job_flow
    user: jobflow
