services:
  - type: web
    name: jobflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    envVars:
      # Database su Neon (piano Free), da impostare a mano su Render (vedi README, "Deploy").
      # DATABASE_URL: connessione diretta di Neon, postgresql://user:password@host/database
      # (host senza "-pooler"). docker-entrypoint.sh la converte nell'URL JDBC e ne ricava
      # DB_USER e DB_PASSWORD. Poi SPRING_PROFILES_ACTIVE=neon (TLS verificato, pool piccolo).
      # Il PostgreSQL Free di Render (jobflow-db) scadeva dopo 30 giorni: non è più nel Blueprint.
      - key: DATABASE_URL
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        sync: false
