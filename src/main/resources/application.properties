spring.application.name=jobflow

# Default per lo sviluppo locale (docker compose); su Render arrivano dalle env var del database.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:job_flow}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Lo schema lo gestisce Flyway (db/migration); Hibernate si limita a validarlo.
spring.jpa.hibernate.ddl-auto=validate
